  /* Carteira360 v2 — tema, privacidade, metas e PWA */
html[data-theme="dark"]{--navy:#09111c;--navy2:#121e2d;--ink:#e9eef5;--muted:#94a1b2;--line:#2b3746;--bg:#111923;--card:#182331;--accent:#b8df4f;--accent2:#b8df4f;--green:#50c792;--red:#ff7f88;--amber:#f0b650;--shadow:0 14px 36px rgba(0,0,0,.22);color-scheme:dark}
html[data-theme="dark"] body,html[data-theme="dark"] .main{background:var(--bg)}
html[data-theme="dark"] .topbar{border-color:var(--line);background:#111923ee}
html[data-theme="dark"] .panel,html[data-theme="dark"] .kpi,html[data-theme="dark"] .summary,html[data-theme="dark"] .secondary,html[data-theme="dark"] .icon-button,html[data-theme="dark"] .modal,html[data-theme="dark"] .backup-list button,html[data-theme="dark"] input,html[data-theme="dark"] select{color:var(--ink);border-color:var(--line);background:var(--card)}
html[data-theme="dark"] .donut-center{background:var(--card)}
html[data-theme="dark"] .kpi-icon,html[data-theme="dark"] .chip,html[data-theme="dark"] .empty .empty-icon,html[data-theme="dark"] .backup-list .backup-icon,html[data-theme="dark"] .form-total{background:#222f3e}
html[data-theme="dark"] .table tbody tr:hover td{background:#1d2a39}
html[data-theme="dark"] .table td,html[data-theme="dark"] .table th,html[data-theme="dark"] .position,html[data-theme="dark"] .perf-row,html[data-theme="dark"] .income-row{border-color:var(--line)}
html[data-theme="dark"] .result-strip,html[data-theme="dark"] .type-tag{background:#243142}
html[data-theme="dark"] .modal-head{border-color:var(--line)}
html[data-theme="dark"] .close{color:var(--ink);background:#243142}
html[data-theme="dark"] .danger,html[data-theme="dark"] .delete-asset{color:#ff9ba2;border-color:#693940;background:#3a252b}
html[data-theme="dark"] .mobile-nav{border-color:var(--line);background:#182331f5}
.topbar-tools{display:flex;align-items:center;gap:8px}.tool-button{position:relative}.tool-button.on{border-color:#9fc936;background:#f4fadf;color:#567509}html[data-theme="dark"] .tool-button.on{background:#2a381d;color:var(--accent)}

  async function updateQuotes(silent=false){
    if(!navigator.onLine){if(!silent)toast("Sem internet. Use a atualização manual.","error");return}
    if(!dbClient||!currentUser){if(!silent)toast("Entre na sua conta para atualizar as cotações.","error");return}
    const targets=state.assets.filter(item=>/^[A-Z]{4}\d{1,2}$/.test(item.ticker)&&!normalizeText(item.type).includes("renda fixa")&&!normalizeText(item.type).includes("tesouro"));
    if(!targets.length){if(!silent)toast("Nenhum ativo compatível foi encontrado.","error");return}
    let updated=0,failed=0;
    for(const item of targets){
      try{
        const {data:payload,error}=await dbClient.functions.invoke("carteira-quotes",{body:{symbols:[item.ticker]}});
        if(error)throw error;
        for(const result of payload?.results||[]){
          const symbol=result.symbol||result.requestedSymbol;
          const price=Number(result.data?.regularMarketPrice??result.regularMarketPrice);
          const asset=state.assets.find(assetItem=>assetItem.ticker===symbol);
          if(asset&&Number.isFinite(price)&&price>0){asset.currentPrice=price;asset.priceReview=false;updated++}
        }
      }catch(error){failed++}
    }
    if(updated){state.settings.lastQuoteUpdate=new Date().toISOString();persist();render();if(!silent)toast(updated+" cotações atualizadas com segurança.")}else if(!silent)toast("Nenhuma cotação foi atualizada. Confira a função e o plano da BRAPI.","error");
    if(failed&&updated&&!silent)setTimeout(()=>toast(updated+" atualizadas; "+failed+" ativos mantiveram o valor anterior."),500)
  }

  function findIndex(headers,names){for(const name of names){const index=headers.findIndex(header=>header.includes(name));if(index>=0)return index}return-1}
  function b3RowsFromCsv(text){const rows=parseCsv(text);if(rows.length<2)throw new Error("CSV vazio");const headers=rows[0].map(normalizeText),dateI=findIndex(headers,["data do negocio","data negociacao","data"]),opI=findIndex(headers,["tipo de movimentacao","entrada saida","operacao","movimentacao"]),tickerI=findIndex(headers,["codigo de negociacao","codigo negociacao","produto","ativo","ticker"]),qtyI=findIndex(headers,["quantidade"]),priceI=findIndex(headers,["preco unitario","preco","valor unitario"]);if([dateI,opI,tickerI,qtyI,priceI].some(i=>i<0))throw new Error("Cabeçalhos não reconhecidos");const parsed=[],invalid=[];rows.slice(1).forEach((row,index)=>{const rawTicker=String(row[tickerI]||"").toUpperCase(),match=rawTicker.match(/[A-Z]{4}\d{1,2}/),opText=normalizeText(row[opI]),operation=opText.includes("venda")||opText==="debito"?"VENDA":opText.includes("compra")||opText==="credito"?"COMPRA":"",item={date:toIsoDate(row[dateI]),operation,ticker:match?match[0]:rawTicker.split(" ")[0],quantity:parseBRNumber(row[qtyI]),unitPrice:parseBRNumber(row[priceI]),fees:0,row:index+2};if(!item.date||!item.operation||!/^[A-Z]{4}\d{1,2}$/.test(item.ticker)||!Number.isFinite(item.quantity)||item.quantity<=0||!Number.isFinite(item.unitPrice)||item.unitPrice<=0)invalid.push(item);else parsed.push(item)});return {parsed,invalid}}
  function fingerprint(item){return [item.date,item.operation,item.ticker,Number(item.quantity).toFixed(6),Number(item.unitPrice).toFixed(6)].join("|")}
  async function handleB3File(file){try{const result=b3RowsFromCsv(await file.text()),existing=new Set(state.transactions.map(fingerprint));pendingB3Rows=result.parsed.filter(item=>!existing.has(fingerprint(item)));const duplicates=result.parsed.length-pendingB3Rows.length;modalShell("Importar extrato da B3","Revise o resumo antes de cadastrar as movimentações.",'<div class="import-summary"><div><span>Novos registros</span><strong>'+pendingB3Rows.length+'</strong></div><div><span>Duplicados ignorados</span><strong>'+duplicates+'</strong></div><div><span>Linhas inválidas</span><strong>'+result.invalid.length+'</strong></div></div><div class="mini-table">'+transactionTable(pendingB3Rows.slice(0,12))+'</div><p class="helper">O importador reconhece variações dos cabeçalhos Data do Negócio, Tipo de Movimentação, Código de Negociação, Quantidade e Preço. Vendas sem posição suficiente serão rejeitadas.</p><footer class="modal-actions"><button class="button secondary" data-action="close">Cancelar</button><button class="button primary" data-action="import-b3-confirm" '+(pendingB3Rows.length?"":"disabled")+'>✓ Importar '+pendingB3Rows.length+' registros</button></footer>',true)}catch(error){toast("CSV da B3 não reconhecido. Confira os cabeçalhos do arquivo.","error")}}
  function confirmB3Import(){let imported=0,errors=0;pendingB3Rows.sort((a,b)=>a.date.localeCompare(b.date)).forEach(item=>{let asset=state.assets.find(asset=>asset.ticker===item.ticker);if(!asset&&item.operation!=="VENDA"){asset={id:"asset-"+Date.now()+"-"+item.ticker,ticker:item.ticker,name:item.ticker,type:item.ticker.endsWith("11")?"Fii":"Ação",sector:"Não informado",segment:"",cnpj:"",quantity:0,averagePrice:0,currentPrice:item.unitPrice,importedPrice:item.unitPrice,priceReview:false,income:0};state.assets.push(asset)}const result=applyTransaction(item,{defer:true});if(result.ok)imported++;else errors++});pendingB3Rows=[];persist();closeModal();render();toast(imported+" movimentações importadas"+(errors?"; "+errors+" rejeitadas por validação.":"."),errors?"error":"ok")}
  function deleteAsset(id){
    const asset=state.assets.find(item=>item.id===id);if(!asset)return;
    const related=state.transactions.filter(item=>item.ticker===asset.ticker).length+state.income.filter(item=>item.ticker===asset.ticker).length+state.futureIncome.filter(item=>item.ticker===asset.ticker).length+state.sales.filter(item=>item.ticker===asset.ticker).length;
    if(!confirm("Excluir "+asset.ticker+" da carteira?\n\nTambém serão removidos "+related+" lançamentos, proventos ou vendas ligados a este ativo. Esta ação não pode ser desfeita sem um backup."))return;
    state.assets=state.assets.filter(item=>item.id!==id);state.transactions=state.transactions.filter(item=>item.ticker!==asset.ticker);state.income=state.income.filter(item=>item.ticker!==asset.ticker);state.futureIncome=state.futureIncome.filter(item=>item.ticker!==asset.ticker);state.sales=state.sales.filter(item=>item.ticker!==asset.ticker);if(!state.assets.length)state.settings.lastQuoteUpdate="";persist();render();toast(asset.ticker+" e seus dados relacionados foram excluídos.")
  }
  function deleteAllAssets(){
    if(!state.assets.length)return;
    if(!confirm("Excluir TODOS os "+state.assets.length+" ativos da carteira?\n\nIsso também apagará todas as movimentações, vendas e todos os proventos recebidos ou futuros. As preferências do aplicativo serão mantidas. Faça um backup antes se quiser recuperar estes dados."))return;
    state.assets=[];state.transactions=[];state.income=[];state.futureIncome=[];state.sales=[];pendingB3Rows=[];state.settings.lastQuoteUpdate="";assetSearch="";typeFilter="Todos";sectorFilter="Todos";persist();render();toast("Carteira apagada. Agora você pode cadastrar novos ativos.")
  }
  document.addEventListener("click",event=>{
    const viewButton=event.target.closest("[data-view]");if(viewButton){view=viewButton.dataset.view;render();window.scrollTo({top:0,behavior:"smooth"});return}
    const tab=event.target.closest("[data-income-tab]");if(tab){incomeTab=tab.dataset.incomeTab;render();return}
    const modalButton=event.target.closest("[data-modal]");if(modalButton){openModal(modalButton.dataset.modal);return}
    const actionButton=event.target.closest("[data-action]");if(!actionButton)return;const action=actionButton.dataset.action;
    if(action==="account"){openModal("account");return}
    if(action==="sign-up"){const form=actionButton.closest('form[data-form="auth"]');if(form)handleAuth(form,"signup");return}
    if(action==="sync-now"){syncState(true);return}
    if(action==="logout"){signOut();return}
    if(action==="close"||(action==="backdrop"&&event.target===actionButton))closeModal();
    if(action==="toggle-theme"){state.settings.theme=state.settings.theme==="dark"?"light":"dark";persist()}
    if(action==="toggle-privacy"){state.settings.hideBalances=!state.settings.hideBalances;persist()}
    if(action==="export-json")download("carteira360-backup-"+today()+".json",backupPayload(),"application/json");
    if(action==="cloud-share")shareBackup();
    if(action==="export-csv"){const rows=[["Data","Operação","Ativo","Quantidade","Valor unitário","Taxas","Montante","Resultado realizado"],...state.transactions.map(item=>[item.date,item.operation,item.ticker,item.quantity,item.unitPrice,item.fees,Number(item.quantity)*Number(item.unitPrice)+Number(item.fees||0),item.realizedResult||""])];download("movimentacoes-carteira.csv","\uFEFF"+rows.map(row=>row.join(";")).join("\n"),"text/csv;charset=utf-8")}
    if(action==="import-json")$("#import-file").click();
    if(action==="open-b3"){closeModal();$("#b3-file").click()}
    if(action==="import-b3-confirm")confirmB3Import();
    if(action==="delete-asset")deleteAsset(actionButton.dataset.id);
    if(action==="delete-all-assets")deleteAllAssets();
    if(action==="mark-future-paid"){const item=state.futureIncome.find(x=>x.id===actionButton.dataset.id);if(item&&!item.received){item.received=true;state.income.unshift({id:"income-"+Date.now(),ticker:item.ticker,type:item.type,date:item.paymentDate,total:item.total,unitValue:item.unitValue});persist();render();toast("Provento movido para recebidos.")}}
    if(action==="reset"&&confirm("Restaurar os dados originais da planilha?")){state=initial();persist();closeModal();render();toast("Dados originais restaurados.")}
    if(action==="print")window.print();
    if(action==="install-pwa"){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.finally(()=>{installPrompt=null})}else toast("Para instalar, abra o pacote por localhost ou publique os arquivos em HTTPS.","error")}
  });
  document.addEventListener("submit",event=>{const form=event.target.closest("form[data-form]");if(!form)return;event.preventDefault();submitForm(form)});
  document.addEventListener("change",event=>{if(event.target.id==="tax-month"){taxMonth=event.target.value;render()}});
  $("#import-file").addEventListener("change",async event=>{const file=event.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.assets)||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.income))throw new Error("invalid");state=migrate(parsed);persist();closeModal();render();toast("Backup importado com sucesso.")}catch(error){toast("Não foi possível importar: arquivo inválido.","error")}event.target.value=""});
  $("#b3-file").addEventListener("change",event=>{const file=event.target.files[0];if(file)handleB3File(file);event.target.value=""});
  document.addEventListener("keydown",event=>{if(event.key==="Escape")closeModal()});
  window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event});
  window.addEventListener("online",()=>{if(currentUser){setSyncStatus("syncing","Conexão restaurada","Sincronizando alterações pendentes");scheduleCloudSync()}});
  window.addEventListener("offline",()=>{setSyncStatus("offline","Salvo no dispositivo","Sem internet para sincronizar")});
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  applyPreferences();render();initSupabase();
})();

  </script>
